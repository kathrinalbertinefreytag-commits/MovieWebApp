{% extends "base.html" %}

{% block content %}
<h2>Users</h2>

<ul class="user-list">
    {% for user in users %}
        <li>
            <a href="{{ url_for('movies', user_id=user.id) }}">
                {{ user.name }}
            </a>
        </li>
    {% else %}
        <li>No users found.</li>
    {% endfor %}
</ul>
{% endblock %}
