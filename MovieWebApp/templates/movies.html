{% extends "base.html" %}

{% block content %}
<h1>{{ user.name }}'s Movies</h1>

<ul>
    {% for movie in movies %}
        <li>
            {{ movie.title }}
            <form style="display:inline;" action="{{ url_for('update_movie', user_id=user.id, movie_id=movie.id) }}" method="post">
                <input type="text" name="title" placeholder="New title">
                <button type="submit">Update</button>
            </form>
            <form style="display:inline;" action="{{ url_for('delete_movie', user_id=user.id, movie_id=movie.id) }}" method="post">
                <button type="submit">Delete</button>
            </form>
        </li>
    {% endfor %}
</ul>

<h2>Add Movie to {{ user.name }}</h2>
<form action="{{ url_for('add_movie_to_user', user_id=user.id) }}" method="post">
    <input type="text" name="title" placeholder="Movie Title" required>
    <button type="submit">Add Movie</button>
</form>

<a href="{{ url_for('home') }}">Back to Home</a>
{% endblock %}
